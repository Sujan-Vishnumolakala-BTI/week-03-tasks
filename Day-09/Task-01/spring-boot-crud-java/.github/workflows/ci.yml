name: CI

on:
  push:
    tags:
      - 'v*'


jobs:

  build:

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: sujanvishnumolakala/spring-crud-java


    steps:

      # Checkout Spring Boot repository
      - name: Checkout Source Code
        uses: actions/checkout@v4


      # Get version from Git tag
      - name: Get Git Tag Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"


      # Install Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # Build Spring Boot JAR
      - name: Package Application
        run: |
          mvn clean package -DskipTests


      # Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # Build Docker image using Git tag
      - name: Build Docker Image
        run: |
          docker build \
          -t $IMAGE_NAME:${{ steps.version.outputs.VERSION }} .


      # Push Docker image
      - name: Push Docker Image
        run: |
          docker push \
          $IMAGE_NAME:${{ steps.version.outputs.VERSION }}



      # Clone deployment repository
      - name: Checkout Deploy Repository
        run: |
          git clone https://${{ secrets.DEPLOY_TOKEN }}@github.com/Sujan-Vishnumolakala-BTI/spring-crud-java-deploy.git



      # Update docker compose image version
      - name: Update Image Tag in Deploy Repo
        run: |

          cd spring-crud-java-deploy

          sed -i \
          "s|spring-crud-java:.*|spring-crud-java:${{ steps.version.outputs.VERSION }}|" \
          docker-compose.yml


      # Commit updated compose file
      - name: Commit Changes
        run: |

          cd spring-crud-java-deploy

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add docker-compose.yml

          git commit -m "Update image version to ${{ steps.version.outputs.VERSION }}"



      # Push change to deploy repo
      - name: Push Deploy Changes
        run: |

          cd spring-crud-java-deploy

          git push