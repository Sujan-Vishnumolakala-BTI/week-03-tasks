name: CD

on:
  workflow_run:
    workflows:
      - Build Java CRUD application
    types:
      - completed

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  deploy:

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: sujanvishnumolakala/spring-crud-java

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      - name: Download Application Artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}


      - name: Verify artifact
        run: |
          ls -lah artifact


      - name: Get Release Version
        id: version
        run: |
          TAG=${{ github.event.workflow_run.head_branch }}
          VERSION=${TAG#v}

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"


      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build Docker Image
        run: |
          docker build \
          -t $IMAGE_NAME:${{ steps.version.outputs.VERSION }} .


      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          severity: CRITICAL,HIGH
          exit-code: 1


      - name: Push Docker Image
        run: |
          docker push \
          $IMAGE_NAME:${{ steps.version.outputs.VERSION }}


      - name: Checkout Deploy Repository
        run: |
          git clone https://${{ secrets.DEPLOY_TOKEN }}@github.com/Sujan-Vishnumolakala-BTI/spring-crud-java-deploy.git


      - name: Update Image Tag
        run: |
          cd spring-crud-java-deploy

          sed -i \
          "s|image: .*|image: $IMAGE_NAME:${{ steps.version.outputs.VERSION }}|" \
          docker-compose.yml


      - name: Commit Deployment Update
        run: |
          cd spring-crud-java-deploy

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docker-compose.yml

          git commit \
          -m "Update image version to ${{ steps.version.outputs.VERSION }}" || echo "No changes"


      - name: Push Deployment Changes
        run: |
          cd spring-crud-java-deploy

          git push