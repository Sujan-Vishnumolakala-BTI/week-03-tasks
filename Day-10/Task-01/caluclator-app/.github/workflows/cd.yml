name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  deploy:

    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: sujanvishnumolakala/python-calculator

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Get Release Version
        id: version
        run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          echo "Release version: $VERSION"


      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build Docker Image
        run: |
          docker build \
          -t $IMAGE_NAME:${{ steps.version.outputs.VERSION }} .


      - name: Push Docker Image
        run: |
          docker push \
          $IMAGE_NAME:${{ steps.version.outputs.VERSION }}


      - name: Checkout Deploy Repository
        run: |
          git clone https://${{ secrets.DEPLOY_TOKEN }}@github.com/Sujan-Vishnumolakala-BTI/python-calculator-deploy.git


      - name: Update Image Tag
        run: |
          cd python-calculator-deploy

          sed -i \
          "s|image: .*|image: $IMAGE_NAME:${{ steps.version.outputs.VERSION }}|" \
          docker-compose.yml


      - name: Commit Deployment Update
        run: |
          cd python-calculator-deploy

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docker-compose.yml

          git commit \
          -m "Update calculator image version to ${{ steps.version.outputs.VERSION }}" \
          || echo "No changes"


      - name: Push Deployment Changes
        run: |
          cd python-calculator-deploy

          git push